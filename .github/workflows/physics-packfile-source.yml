name: Physics packfile validation

on:
  push:
    branches: [codex/physics-packfile-header-bounds]
    paths:
      - .github/workflows/physics-packfile-source.yml
      - src/client/component/fastfiles.cpp
      - src/client/component/physics_packfile.hpp
      - src/client/game/types/database.hpp
      - tests/physics_packfile_header_test.cpp
      - tests/physics_packfile_source_test.py
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/physics-packfile-source.yml
      - src/client/component/fastfiles.cpp
      - src/client/component/physics_packfile.hpp
      - src/client/game/types/database.hpp
      - tests/physics_packfile_header_test.cpp
      - tests/physics_packfile_source_test.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physics-packfile-header:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out fixture Source and baseline history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
          lfs: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/client/component/fastfiles.cpp
            /src/client/component/physics_packfile.hpp
            /src/client/game/types/database.hpp
            /tests/physics_packfile_header_test.cpp
            /tests/physics_packfile_source_test.py
      - name: Verify production Source extraction and bounds order
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s python -B tests/physics_packfile_source_test.py
      - name: Compile standalone production-helper fixture
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O1 -g \
            -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all \
            tests/physics_packfile_header_test.cpp -o "$RUNNER_TEMP/physics-packfile-header-test"
      - name: Run authored fixture under address and undefined-behavior sanitizers
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          timeout 30s "$RUNNER_TEMP/physics-packfile-header-test"
